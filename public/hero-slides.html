<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hero Carousel</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      .slide-preview {
        width: 100%;
        max-width: 220px;
        aspect-ratio: 16 / 10;
        object-fit: cover;
        border-radius: 12px;
        border: 1px solid #e5e7eb;
        background: #f9fafb;
      }
      .table-spinner {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }
      .table-spinner div {
        border: 6px solid #f3f3f3;
        border-top: 6px solid #007bff;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .hero-thumb {
        width: 90px;
        height: 60px;
        object-fit: cover;
        border-radius: 8px;
        border: 1px solid #e5e7eb;
      }
      .hero-bg-thumb {
        width: 90px;
        height: 60px;
        object-fit: cover;
        border-radius: 8px;
        border: 1px solid #e5e7eb;
        background: linear-gradient(135deg, #34d399, #10b981);
      }
      .hero-desc {
        max-width: 360px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .hero-bg-preview {
        width: 100%;
        max-width: 220px;
        aspect-ratio: 16 / 9;
        object-fit: cover;
        border-radius: 12px;
        border: 1px solid #e5e7eb;
        background: linear-gradient(135deg, #34d399, #10b981);
      }
    </style>
  </head>
  <body>
    <div class="dashboard-container">
      <aside class="sidebar">
        <div class="logo">
          <a href="index.html" style="text-decoration: none; color: inherit">
            <span>NEESOLAR</span>
          </a>
          <button class="hamburger-btn mobile-close" id="hamburger-close">
            <i class="fas fa-times"></i>
          </button>
        </div>

        <nav class="main-nav">
          <ul>
            <li>
              <a href="index.html"><i class="fas fa-th-large"></i> Dashboard</a>
            </li>
            <li>
              <a href="add-new-product.html"
                ><i class="fas fa-plus-circle"></i> Add Products</a
              >
            </li>
            <li>
              <a href="products.html"
                ><i class="fas fa-box-open"></i> Product Stock</a
              >
            </li>
            <li class="active">
              <a href="hero-slides.html"
                ><i class="fas fa-images"></i> Hero Carousel</a
              >
            </li>
            <li>
              <a href="reviews.html"
                ><i class="fas fa-star"></i> Customer Reviews</a
              >
            </li>
            <li>
              <a href="#" id="logout-link"
                ><i class="fas fa-sign-out-alt"></i> Logout</a
              >
            </li>
          </ul>
        </nav>
      </aside>

      <main class="main-content">
        <header class="top-header">
          <button class="hamburger-btn hamburger-btn-open" id="hamburger-open">
            <i class="fas fa-bars"></i>
          </button>
          <div>
            <p style="margin: 0; color: #6b7280; font-size: 0.9rem">
              Manage homepage carousel content
            </p>
          </div>
        </header>

        <section class="card product-list-card">
          <div class="card-header-actions">
            <h1>Hero Carousel</h1>
            <div class="review-badge">
              <i class="fas fa-shield-alt"></i>
              Admin only
            </div>
          </div>

          <form id="heroSlideForm" class="review-create-form">
            <div class="review-create-grid">
              <div class="mb-0">
                <label for="heroEyebrow" class="form-label">Eyebrow</label>
                <input id="heroEyebrow" class="form-control" type="text" required value="Welcome to Nees Solar" />
              </div>
              <div class="mb-0">
                <label for="heroSortOrder" class="form-label">Sort Order</label>
                <input id="heroSortOrder" class="form-control" type="number" value="0" />
              </div>
            </div>

            <div class="mt-3">
              <label for="heroTitle" class="form-label">Title</label>
              <input id="heroTitle" class="form-control" type="text" required value="SMART ENERGY." />
            </div>

            <div class="mt-3">
              <label for="heroDescription" class="form-label">Description</label>
              <textarea id="heroDescription" class="form-control" rows="3" required>Harness the power of the sun with our premium solar solutions</textarea>
            </div>

            <div class="review-create-grid mt-3">
              <div class="mb-0">
                <label for="heroButtonText" class="form-label">Button Text</label>
                <input id="heroButtonText" class="form-control" type="text" required value="SHOP NOW" />
              </div>
              <div class="mb-0">
                <label for="heroButtonLink" class="form-label">Button Link</label>
                <input id="heroButtonLink" class="form-control" type="text" required value="/products" />
              </div>
            </div>

            <div class="mt-3">
              <label for="heroImage" class="form-label">Hero Image</label>
              <input id="heroImage" class="form-control" type="file" accept="image/*" />
              <small class="text-muted">Upload a new image for the slide.</small>
            </div>

            <div class="mt-3">
              <img id="heroImagePreview" class="slide-preview" src="/placeholder.svg" alt="Hero preview" />
            </div>

            <div class="mt-3">
              <label for="heroBackgroundImage" class="form-label">Background Photo</label>
              <input id="heroBackgroundImage" class="form-control" type="file" accept="image/*" />
              <small class="text-muted">Optional. If empty, the green background stays.</small>
            </div>

            <div class="mt-3">
              <img id="heroBackgroundPreview" class="hero-bg-preview" src="/placeholder.svg" alt="Background preview" />
            </div>

            <div class="d-flex align-items-center gap-3 mt-4 flex-wrap">
              <button type="submit" class="btn btn-success">
                <i class="fas fa-plus"></i> Publish Slide
              </button>
              <span id="heroFormStatus" class="text-muted"></span>
            </div>
          </form>

          <div class="table-container">
            <table class="display" style="width: 100%">
              <thead>
                <tr>
                  <th>Image</th>
                  <th>Background</th>
                  <th>Title</th>
                  <th>Description</th>
                  <th>Order</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="heroTableBody">
                <tr id="loadingRow">
                  <td colspan="6" class="table-spinner">
                    <div></div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jwt-decode@3.1.2/build/jwt-decode.js"></script>
    <script>
      const backendUrl =
        window.location.protocol === 'file:'
          ? 'https://api.yunqidaenergyneessolar.com'
          : window.location.origin
      const token = localStorage.getItem('token')
      const heroSlideForm = document.getElementById('heroSlideForm')
      const heroFormStatus = document.getElementById('heroFormStatus')
      const heroBackgroundPreview = document.getElementById('heroBackgroundPreview')

      function redirectToLogin() {
        window.location.href = `${window.location.origin}/admin-login.html`
      }

      ;(function () {
        if (!token) return redirectToLogin()
        try {
          const decoded = jwt_decode(token)
          if (Date.now() > decoded.exp * 1000) {
            localStorage.removeItem('token')
            redirectToLogin()
          }
        } catch (error) {
          localStorage.removeItem('token')
          redirectToLogin()
        }
      })()

      const sidebar = document.querySelector('.sidebar')
      document.getElementById('hamburger-open').addEventListener('click', function () {
        sidebar.classList.add('show')
      })
      document.getElementById('hamburger-close').addEventListener('click', function () {
        sidebar.classList.remove('show')
      })
      document.getElementById('logout-link').addEventListener('click', function (e) {
        e.preventDefault()
        localStorage.removeItem('token')
        window.location.href = 'admin-login.html'
      })

      function escapeHtml(value) {
        return String(value || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;')
      }

      function getImageUrl(imagePath) {
        if (!imagePath) return '/placeholder.svg'
        if (imagePath.startsWith('http')) return imagePath
        return `${backendUrl}${imagePath}`
      }

      function formatDate(value) {
        if (!value) return '-'
        const date = new Date(value)
        return Number.isNaN(date.getTime()) ? '-' : date.toLocaleString()
      }

      document.getElementById('heroImage').addEventListener('change', (e) => {
        const file = e.target.files && e.target.files[0]
        if (!file) return
        document.getElementById('heroImagePreview').src = URL.createObjectURL(file)
      })

      document
        .getElementById('heroBackgroundImage')
        .addEventListener('change', (e) => {
          const file = e.target.files && e.target.files[0]
          if (!file) return
          heroBackgroundPreview.src = URL.createObjectURL(file)
        })

      async function loadHeroSlides() {
        const tableBody = document.getElementById('heroTableBody')
        try {
          tableBody.innerHTML =
            '<tr id="loadingRow"><td colspan="6" class="table-spinner"><div></div></td></tr>'
          const res = await fetch(`${backendUrl}/api/admin/hero-slides?_=${Date.now()}`, {
            cache: 'no-store',
            headers: {
              'Cache-Control': 'no-cache',
              Authorization: `Bearer ${token}`
            }
          })
          if (!res.ok) throw new Error('Failed to fetch hero slides.')
          const slides = await res.json()
          tableBody.innerHTML = ''

          if (!slides.length) {
            tableBody.innerHTML =
              '<tr><td colspan="6" style="text-align:center; padding:20px;">No hero slides found.</td></tr>'
            return
          }

          slides.forEach((slide) => {
            const tr = document.createElement('tr')
            tr.id = `slide-${slide.id}`
            tr.innerHTML = `
              <td><img src="${getImageUrl(slide.image)}" class="hero-thumb" alt="Hero slide" /></td>
              <td>${
                slide.backgroundImage
                  ? `<img src="${getImageUrl(slide.backgroundImage)}" class="hero-bg-thumb" alt="Background image" />`
                  : '<span class="badge bg-success">Green default</span>'
              }</td>
              <td>${escapeHtml(slide.title)}</td>
              <td><div class="hero-desc" title="${escapeHtml(slide.description)}">${escapeHtml(slide.description)}</div></td>
              <td>${escapeHtml(slide.sortOrder ?? 0)}</td>
              <td>
                <button type="button" class="btn btn-sm btn-outline-danger delete-slide-btn">
                  <i class="fas fa-trash"></i>
                </button>
              </td>
            `
            tableBody.appendChild(tr)
            tr.querySelector('.delete-slide-btn').addEventListener('click', () =>
              deleteSlide(slide.id)
            )
          })
        } catch (error) {
          tableBody.innerHTML =
            '<tr><td colspan="5" style="text-align:center; color:red;">Error loading hero slides</td></tr>'
          console.error(error)
        }
      }

      heroSlideForm.addEventListener('submit', async (event) => {
        event.preventDefault()
        heroFormStatus.textContent = 'Publishing...'

        const formData = new FormData()
        formData.append('eyebrow', document.getElementById('heroEyebrow').value.trim())
        formData.append('title', document.getElementById('heroTitle').value.trim())
        formData.append('description', document.getElementById('heroDescription').value.trim())
        formData.append('buttonText', document.getElementById('heroButtonText').value.trim())
        formData.append('buttonLink', document.getElementById('heroButtonLink').value.trim())
        formData.append('sortOrder', document.getElementById('heroSortOrder').value || '0')

        const imageFile = document.getElementById('heroImage').files[0]
        if (imageFile) {
          formData.append('image', imageFile)
        }

        const backgroundFile = document.getElementById('heroBackgroundImage').files[0]
        if (backgroundFile) {
          formData.append('backgroundImage', backgroundFile)
        }

        try {
          const res = await fetch(`${backendUrl}/api/admin/hero-slides`, {
            method: 'POST',
            headers: {
              Authorization: `Bearer ${token}`
            },
            body: formData
          })

          const data = await res.json()
          if (!res.ok) throw new Error(data.error || 'Failed to publish hero slide.')

          heroSlideForm.reset()
          document.getElementById('heroImagePreview').src = '/placeholder.svg'
          heroBackgroundPreview.src = '/placeholder.svg'
          document.getElementById('heroEyebrow').value = 'Welcome to Nees Solar'
          document.getElementById('heroTitle').value = 'SMART ENERGY.'
          document.getElementById('heroDescription').value =
            'Harness the power of the sun with our premium solar solutions'
          document.getElementById('heroButtonText').value = 'SHOP NOW'
          document.getElementById('heroButtonLink').value = '/products'
          document.getElementById('heroSortOrder').value = '0'
          heroFormStatus.textContent = 'Hero slide published successfully.'
          await loadHeroSlides()
        } catch (error) {
          heroFormStatus.textContent = error.message
        }
      })

      async function deleteSlide(id) {
        if (!confirm('Delete this hero slide?')) return
        try {
          const res = await fetch(`${backendUrl}/api/admin/hero-slides/${id}`, {
            method: 'DELETE',
            headers: { Authorization: `Bearer ${token}` }
          })
          if (!res.ok) throw new Error('Failed to delete hero slide.')
          document.getElementById(`slide-${id}`)?.remove()
        } catch (error) {
          alert(error.message)
        }
      }

      document.addEventListener('DOMContentLoaded', loadHeroSlides)
    </script>
  </body>
</html>
