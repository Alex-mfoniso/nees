<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer Reviews</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      .review-comment {
        max-width: 420px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .table-spinner {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }
      .table-spinner div {
        border: 6px solid #f3f3f3;
        border-top: 6px solid #007bff;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      .review-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        border-radius: 999px;
        background: #ecfdf5;
        color: #047857;
        font-weight: 600;
      }
      .review-create-form {
        margin: 1rem 0 1.5rem;
        padding: 1rem;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        background: #f9fafb;
      }
      .review-create-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 1rem;
      }
      @media (max-width: 768px) {
        .review-create-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="dashboard-container">
      <aside class="sidebar">
        <div class="logo">
          <a href="index.html" style="text-decoration: none; color: inherit">
            <span>NEESOLAR</span>
          </a>

          <button class="hamburger-btn mobile-close" id="hamburger-close">
            <i class="fas fa-times"></i>
          </button>
        </div>

        <nav class="main-nav">
          <ul>
            <li>
              <a href="index.html"><i class="fas fa-th-large"></i> Dashboard</a>
            </li>
            <li>
              <a href="add-new-product.html"
                ><i class="fas fa-plus-circle"></i> Add Products</a
              >
            </li>
            <li>
              <a href="products.html"
                ><i class="fas fa-box-open"></i> Product Stock</a
              >
            </li>
            <li>
              <a href="hero-slides.html"
                ><i class="fas fa-images"></i> Hero Carousel</a
              >
            </li>
            <li class="active">
              <a href="reviews.html"
                ><i class="fas fa-star"></i> Customer Reviews</a
              >
            </li>
            <li>
              <a href="#" id="logout-link"
                ><i class="fas fa-sign-out-alt"></i> Logout</a
              >
            </li>
          </ul>
        </nav>
      </aside>

      <main class="main-content">
        <header class="top-header">
          <button class="hamburger-btn hamburger-btn-open" id="hamburger-open">
            <i class="fas fa-bars"></i>
          </button>
          <div>
            <p style="margin: 0; color: #6b7280; font-size: 0.9rem">
              Admin Reviews Panel
            </p>
          </div>
        </header>

        <section class="card product-list-card">
          <div class="card-header-actions">
            <h1>Customer Reviews</h1>
            <div class="review-badge">
              <i class="fas fa-shield-alt"></i>
              Admin only
            </div>
          </div>

          <form id="createReviewForm" class="review-create-form">
            <div class="review-create-grid">
              <div class="mb-0">
                <label for="reviewName" class="form-label">Customer Name</label>
                <input
                  id="reviewName"
                  class="form-control"
                  type="text"
                  required
                />
              </div>
              <div class="mb-0">
                <label for="reviewRating" class="form-label">Rating</label>
                <select id="reviewRating" class="form-select" required>
                  <option value="5">5 stars</option>
                  <option value="4">4 stars</option>
                  <option value="3">3 stars</option>
                  <option value="2">2 stars</option>
                  <option value="1">1 star</option>
                </select>
              </div>
            </div>

            <div class="mt-3">
              <label for="reviewComment" class="form-label">Comment</label>
              <textarea
                id="reviewComment"
                class="form-control"
                rows="4"
                required
              ></textarea>
            </div>

            <div class="mt-3">
              <label for="reviewAvatar" class="form-label">Avatar URL</label>
              <input
                id="reviewAvatar"
                class="form-control"
                type="url"
                placeholder="Optional image URL"
              />
            </div>

            <div class="d-flex align-items-center gap-3 mt-4 flex-wrap">
              <button type="submit" class="btn btn-success">
                <i class="fas fa-plus"></i> Publish Review
              </button>
              <span id="reviewFormStatus" class="text-muted"></span>
            </div>
          </form>

          <div class="table-container">
            <table class="display" style="width: 100%">
              <thead>
                <tr>
                  <th>Customer</th>
                  <th>Rating</th>
                  <th>Comment</th>
                  <th>Date</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="reviewTableBody">
                <tr id="loadingRow">
                  <td colspan="5" class="table-spinner">
                    <div></div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <div
      class="modal fade"
      id="reviewDetailModal"
      tabindex="-1"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Review Details</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label">Customer Name</label>
              <input id="detailName" class="form-control" readonly />
            </div>
            <div class="mb-3">
              <label class="form-label">Rating</label>
              <input id="detailRating" class="form-control" readonly />
            </div>
            <div class="mb-3">
              <label class="form-label">Comment</label>
              <textarea
                id="detailComment"
                class="form-control"
                rows="5"
                readonly
              ></textarea>
            </div>
            <div>
              <label class="form-label">Created At</label>
              <input id="detailDate" class="form-control" readonly />
            </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
            <button
              type="button"
              class="btn btn-danger"
              id="deleteFromModalBtn"
            >
              Delete Review
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jwt-decode@3.1.2/build/jwt-decode.js"></script>
    <script>
      const backendUrl =
        window.location.protocol === 'file:'
          ? 'https://api.neessolarsunrisenigeria.com'
          : window.location.origin
      const token = localStorage.getItem('token')
      let selectedReviewId = null
      const createReviewForm = document.getElementById('createReviewForm')
      const reviewFormStatus = document.getElementById('reviewFormStatus')

      function redirectToLogin() {
        window.location.href = `${window.location.origin}/admin-login.html`
      }

      ;(function () {
        if (!token) return redirectToLogin()
        try {
          const decoded = jwt_decode(token)
          if (Date.now() > decoded.exp * 1000) {
            localStorage.removeItem('token')
            redirectToLogin()
          }
        } catch (error) {
          localStorage.removeItem('token')
          redirectToLogin()
        }
      })()

      const sidebar = document.querySelector('.sidebar')
      document
        .getElementById('hamburger-open')
        .addEventListener('click', function () {
          sidebar.classList.add('show')
        })
      document
        .getElementById('hamburger-close')
        .addEventListener('click', function () {
          sidebar.classList.remove('show')
        })
      document
        .getElementById('logout-link')
        .addEventListener('click', function (e) {
          e.preventDefault()
          localStorage.removeItem('token')
          window.location.href = 'admin-login.html'
        })

      function renderStars(rating) {
        const value = Math.max(1, Math.min(5, Number(rating) || 5))
        return '★'.repeat(value) + '☆'.repeat(Math.max(0, 5 - value))
      }

      function escapeHtml(value) {
        return String(value || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;')
      }

      function formatDate(value) {
        if (!value) return '-'
        const date = new Date(value)
        return Number.isNaN(date.getTime()) ? '-' : date.toLocaleString()
      }

      function openReviewModal(review) {
        selectedReviewId = review.id
        document.getElementById('detailName').value = review.name || ''
        document.getElementById('detailRating').value = `${renderStars(
          review.rating
        )} (${review.rating || 5}/5)`
        document.getElementById('detailComment').value = review.comment || ''
        document.getElementById('detailDate').value = formatDate(
          review.createdAt
        )
        new bootstrap.Modal(document.getElementById('reviewDetailModal')).show()
      }

      async function loadReviews() {
        const tableBody = document.getElementById('reviewTableBody')
        try {
          tableBody.innerHTML =
            '<tr id="loadingRow"><td colspan="5" class="table-spinner"><div></div></td></tr>'
          const res = await fetch(
            `${backendUrl}/api/admin/reviews?_=${Date.now()}`,
            {
              cache: 'no-store',
              headers: {
                'Cache-Control': 'no-cache',
                Authorization: `Bearer ${token}`
              }
            }
          )
          if (!res.ok) throw new Error('Failed to fetch reviews.')
          const reviews = await res.json()
          tableBody.innerHTML = ''

          if (!reviews.length) {
            tableBody.innerHTML =
              '<tr><td colspan="5" style="text-align:center; padding:20px;">No reviews found.</td></tr>'
            return
          }

          reviews.forEach((review) => {
            const tr = document.createElement('tr')
            tr.id = `review-${review.id}`
            tr.innerHTML = `
              <td>${escapeHtml(review.name)}</td>
              <td>${renderStars(review.rating)}</td>
              <td><div class="review-comment" title="${escapeHtml(
                review.comment
              )}">${escapeHtml(review.comment)}</div></td>
              <td>${formatDate(review.createdAt)}</td>
              <td>
                <div class="btn-group" role="group">
                  <button type="button" class="btn btn-sm btn-outline-primary view-review-btn">
                    <i class="fas fa-eye"></i>
                  </button>
                  <button type="button" class="btn btn-sm btn-outline-danger delete-review-btn">
                    <i class="fas fa-trash"></i>
                  </button>
                </div>
              </td>
            `
            tableBody.appendChild(tr)

            tr.querySelector('.view-review-btn').addEventListener('click', () =>
              openReviewModal(review)
            )
            tr.querySelector('.delete-review-btn').addEventListener(
              'click',
              () => deleteReview(review.id)
            )
          })
        } catch (error) {
          tableBody.innerHTML =
            '<tr><td colspan="5" style="text-align:center; color:red;">Error loading reviews</td></tr>'
          console.error(error)
        }
      }

      createReviewForm.addEventListener('submit', async (event) => {
        event.preventDefault()
        reviewFormStatus.textContent = 'Publishing...'

        const payload = {
          name: document.getElementById('reviewName').value.trim(),
          rating: document.getElementById('reviewRating').value,
          comment: document.getElementById('reviewComment').value.trim(),
          avatarUrl: document.getElementById('reviewAvatar').value.trim()
        }

        try {
          const res = await fetch(`${backendUrl}/api/reviews`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
          })

          if (!res.ok) throw new Error('Failed to publish review.')

          createReviewForm.reset()
          reviewFormStatus.textContent = 'Review published successfully.'
          await loadReviews()
        } catch (error) {
          reviewFormStatus.textContent = error.message
        }
      })

      async function deleteReview(id) {
        if (!confirm('Delete this review?')) return
        try {
          const res = await fetch(`${backendUrl}/api/reviews/${id}`, {
            method: 'DELETE',
            headers: { Authorization: `Bearer ${token}` }
          })
          if (!res.ok) throw new Error('Failed to delete review.')
          document.getElementById(`review-${id}`)?.remove()
        } catch (error) {
          alert(error.message)
        }
      }

      document
        .getElementById('deleteFromModalBtn')
        .addEventListener('click', async () => {
          if (!selectedReviewId) return
          await deleteReview(selectedReviewId)
          bootstrap.Modal.getInstance(
            document.getElementById('reviewDetailModal')
          ).hide()
        })

      document.addEventListener('DOMContentLoaded', loadReviews)
    </script>
  </body>
</html>
